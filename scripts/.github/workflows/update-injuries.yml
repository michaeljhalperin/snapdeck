name: Update injuries

on:
  # This is your "scrape now" button. Actions tab -> Update injuries -> Run workflow.
  workflow_dispatch:

  # Times are UTC. Roughly 9am / 5pm / 9pm US Eastern, to catch the
  # Wed-Fri practice reports and the Friday final game designations.
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 21 * * *"
    - cron: "0 1 * * *"

# Lets the job push the updated data file back into the repo.
permissions:
  contents: write

# If you click Run workflow while a scheduled run is going, don't collide.
concurrency:
  group: update-injuries
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      # If NFL.com changed and the scraper can't make sense of the page,
      # this step fails, the steps below never run, and the old
      # data/injuries.json stays exactly as it was.
      - name: Scrape NFL.com injury report
        run: python scripts/scrape_injuries.py

      - name: Commit if anything changed
        run: |
          git config user.name "snap-deck-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/injuries.json
          if git diff --staged --quiet; then
            echo "No injury changes since last run."
          else
            git commit -m "Update injuries ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
