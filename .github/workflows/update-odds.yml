name: Update TD odds

on:
  workflow_dispatch:
    inputs:
      teams:
        description: 'Only these teams (e.g. SEA,NE). Blank = all games. Other games keep their existing prices.'
        required: false
        default: ''
      regions:
        description: 'Books to pull. us_ex adds the exchanges but doubles the credit cost.'
        required: false
        default: 'us,us_ex'
        type: choice
        options:
          - 'us,us_ex'
          - 'us'
          - 'us_ex'

permissions:
  contents: write

concurrency:
  group: update-odds
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Scrape anytime TD odds
        env:
          # Settings > Secrets and variables > Actions.
          # Never put this key in index.html; the page is public.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Scheduled runs get the defaults; manual runs use what you typed.
          ONLY_TEAMS: ${{ inputs.teams }}
          ODDS_REGIONS: ${{ inputs.regions || 'us,us_ex' }}
        run: python scripts/scrape_odds.py

      - name: Commit if anything changed
        run: |
          git config user.name "snap-deck-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odds.json
          if git diff --staged --quiet; then
            echo "No odds changes since last run."
          else
            git commit -m "Update TD odds ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
